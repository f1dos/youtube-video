name: Publish Final Texas States Explained 1080p60
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-texas.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-video:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      VIDEO_URL: https://at.adobe.com/0U6kYqYcpsi9qMQH
      VIDEO_FILE: Texas_States_Explained_1080p60.mp4
    steps:
      - name: Download final Texas movie
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-delay 3 --output "$VIDEO_FILE" "$VIDEO_URL"
          size=$(stat -c%s "$VIDEO_FILE")
          echo "Downloaded bytes: $size"
          if (( size < 410000000 )); then
            echo "Download did not match expected 417 MB video size" >&2
            exit 1
          fi
          file "$VIDEO_FILE"
      - name: Create public GitHub Release with downloadable MP4
        shell: bash
        run: |
          set -euo pipefail
          gh release create texas-states-explained-final-1080p60 "$VIDEO_FILE" \
            --repo "${{ github.repository }}" \
            --title "Texas — States Explained (Final 1080p60)" \
            --notes "Final States Explained edit: 1920 x 1080, 60 fps, 8 minutes 26 seconds, highlighted subtitles, smooth zooms, transitions and parallax." \
            --target main
