name: Publish Texas Shorts 1080x1920 60fps
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-texas.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-shorts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download and verify three Shorts
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-delay 3 -o 01_The_Alamo.mp4 "https://at.adobe.com/t0F9KQNRq4Uwa81D"
          curl --fail --location --retry 5 --retry-delay 3 -o 02_18_Minutes.mp4 "https://at.adobe.com/XWzRksFV3j5x9Q95"
          curl --fail --location --retry 5 --retry-delay 3 -o 03_Oil_to_the_Moon.mp4 "https://at.adobe.com/PnmxQDvJjJp0CNIh"
          test "$(stat -c%s 01_The_Alamo.mp4)" = "26985931"
          test "$(stat -c%s 02_18_Minutes.mp4)" = "13041917"
          test "$(stat -c%s 03_Oil_to_the_Moon.mp4)" = "19259440"
          echo "2dadfe4f8b90777ffa3b58f80e45dfac744d5fb7b54b94f471884193f599b1f5  01_The_Alamo.mp4" | sha256sum --check
          echo "470927718a500758025e231040fe10761f5513ab9eb59a01264d86c96f40047e  02_18_Minutes.mp4" | sha256sum --check
          echo "e4dded4a74be0af65692a3b9d443356c7dd07380c5fea487a0385e65d8081e69  03_Oil_to_the_Moon.mp4" | sha256sum --check
      - name: Publish Shorts release
        shell: bash
        run: |
          set -euo pipefail
          gh release create texas-shorts-vertical-2026-10-31             01_The_Alamo.mp4 02_18_Minutes.mp4 03_Oil_to_the_Moon.mp4             --repo "${{ github.repository }}"             --title "Texas — 3 Vertical Shorts (1080x1920, 60fps)"             --notes "Three selected moments from States Explained: The Alamo; the 18-minute Battle of San Jacinto; and Texas from Spindletop oil to Mission Control. Vertical reframing, animated zooms, transition accents, and synchronized word-highlight subtitles. Full-file decoding verified."             --target main
